# 目标文件名：data/plugins/drliuhuan__dsh-plugin-feishu-im.yml
url: https://github.com/drliuhuan/dsh-plugin-feishu-im
name: drliuhuan/dsh-plugin-feishu-im
category: remote
description:
  en: 'Feishu IM bridge for dsh: create a dedicated Feishu bot by scanning a QR code, receive one card per finished turn, answer tool approvals and structured questions from the chat, and drive a session from it — including listing and switching the bound session with /sessions and /resume. Messages are sent as Card JSON 2.0, so headings, quotes, code blocks and tables render; long output paginates instead of being cut. Published on npm with provenance.'
  zh: '飞书 IM 通道：扫码创建专属飞书机器人；每轮结束推一张卡片；在飞书里授权工具调用、回答结构化提问，并直接用聊天驱动会话（/sessions 列会话、/resume 切换绑定会话）。消息以卡片 JSON 2.0 发送，标题、引用、代码块与表格都能渲染，超长内容按段分页而不是截断。已发布到 npm 并带 provenance。'
